<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; connect-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera Film Simulasi</title>
<style>
:root{color-scheme:dark;--ink:#ecebe4;--dim:#9a9c92;--fuji:#2fb36b;--lcd:#9be5b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;color:var(--ink);
background:#0e0e0d radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px) 0 0/5px 5px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 10px 0}
/* top plate */
.plate{position:relative;height:104px;border-radius:18px 18px 6px 6px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
background:linear-gradient(180deg,#e4e4df 0%,#b4b4ae 40%,#d3d3cd 52%,#8f8f8a 100%);box-shadow:0 2px 0 #fff6 inset,0 -3px 6px #0005 inset,0 6px 14px #000a}
.plate::before{content:"";position:absolute;left:50%;top:-7px;width:92px;height:12px;transform:translateX(-50%);border-radius:5px 5px 0 0;background:linear-gradient(#cfcfc9,#7d7d78)}
.badge{position:absolute;left:50%;top:16px;transform:translateX(-50%);text-align:center;color:#2a2a28;font-weight:700;font-size:17px;letter-spacing:.06em;font-style:italic;text-shadow:0 1px 0 #fff8}
.badge small{display:block;font-size:10px;font-style:normal;font-weight:600;letter-spacing:.12em;color:#55554f}
.dial{position:relative;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px #0008,0 0 0 2px #4446}
.ring{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#2e2e2c 0 4deg,#9a9a95 4deg 8deg);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.ring::after{content:"";position:absolute;left:50%;top:1px;width:3px;height:9px;margin-left:-1.5px;border-radius:2px;background:#e8452c}
.dial .face{position:absolute;z-index:1;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4a47,#161615);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;box-shadow:0 1px 0 #fff3 inset}
.dial .cap{font-size:9px;letter-spacing:.14em;color:var(--dim)}
.dial .val{font-size:12.5px;font-weight:700;line-height:1.05;color:var(--ink);max-width:56px}
.dial select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border-radius:50%}
/* screen */
.bezel{position:relative;flex:1;min-height:0;margin:10px 4px;border-radius:14px;padding:9px;background:linear-gradient(145deg,#2a2a28,#0b0b0a);box-shadow:0 0 0 2px #555 inset,0 0 0 4px #111,0 10px 22px #000a}
.vf{position:relative;width:100%;height:100%;border-radius:7px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px #000,0 0 18px #000 inset}
canvas{max-width:100%;max-height:100%;display:block}
.corner{position:absolute;width:22px;height:22px;border:2px solid #fff9;pointer-events:none}
.c1{left:12px;top:12px;border-right:0;border-bottom:0}.c2{right:12px;top:12px;border-left:0;border-bottom:0}
.c3{left:12px;bottom:46px;border-right:0;border-top:0}.c4{right:12px;bottom:46px;border-left:0;border-top:0}
.info{position:absolute;left:0;right:0;bottom:0;padding:7px 12px;background:linear-gradient(transparent,#000b);color:var(--lcd);font:700 13px ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:space-between;gap:8px;pointer-events:none;text-shadow:0 0 6px #2fb36b99}
.info span:last-child{color:#9bd6b0aa;font-weight:500;text-align:right}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.85;transition:none}
.msg{position:absolute;inset:0;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0d0e0c}
.msg.show{display:flex}
.msg p{margin:0;color:var(--dim);font-size:16px;max-width:290px;line-height:1.4}
.btn{background:var(--fuji);color:#06130b;border:0;border-radius:8px;padding:12px 20px;font:700 16px inherit;font-family:inherit}
.ghost{background:transparent;color:var(--ink);border:1px solid #444}
/* grip */
.grip{height:132px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;margin:0 -10px;
background:#151514 radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px) 0 0/4px 4px;border-top:2px solid #2a2a28}
.knob{width:54px;height:54px;border-radius:50%;border:0;color:#222;display:flex;align-items:center;justify-content:center;
background:linear-gradient(180deg,#e0e0db,#8d8d88);box-shadow:0 3px 6px #000a,0 1px 0 #fff8 inset}
.knob:active{transform:translateY(1px);filter:brightness(.9)}
.shutter{position:relative;width:92px;height:92px;border-radius:50%;border:0;padding:0;
background:conic-gradient(from 20deg,#f0f0eb,#8a8a85,#e9e9e4,#7d7d78,#f0f0eb);box-shadow:0 6px 12px #000c,0 0 0 3px #0008}
.shutter::before{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#555,#0d0d0c 70%);box-shadow:0 0 0 2px #0009}
.shutter::after{content:"";position:absolute;inset:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7bd3ff55,#1a2a55 45%,#05060d);box-shadow:0 0 0 1px #fff3}
.shutter:active{transform:scale(.96)}
.thumb{width:54px;height:54px;border-radius:8px;border:2px solid #8d8d88;background:#0c0d0b center/cover;box-shadow:0 3px 6px #000a}
.grip .l{justify-self:start}.grip .r{justify-self:end}
.ov{position:fixed;inset:0;background:rgba(10,11,9,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;text-align:center}
.ov.show{display:flex}
.pola{background:#f2f1ea;padding:10px 10px 0;border-radius:2px;box-shadow:0 10px 30px #000;max-width:100%;display:flex;flex-direction:column;transform:rotate(-1.5deg)}
.pola img{display:block;max-width:100%;max-height:calc(100vh - 300px)}
#cap{padding:10px 4px 13px;color:#3a3a36;font:italic 18px "Bradley Hand","Segoe Script","Comic Sans MS",cursive;text-align:center}
.ov p{margin:0;color:var(--dim);font-size:14px}
.row{display:flex;gap:10px}
.lcd{position:absolute;left:50%;top:58px;transform:translateX(-50%);display:flex;align-items:baseline;gap:5px;padding:3px 10px;border-radius:5px;background:#0b110d;box-shadow:0 0 0 2px #6a6a65,0 1px 0 2px #fff7;color:var(--lcd);font:700 11px ui-monospace,Menlo,Consolas,monospace;text-shadow:0 0 5px #2fb36b}
.lcd b{font-size:17px}.lcd span{opacity:.7}
.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 30%)}
.grip{position:relative}
.grip::before{content:"";position:absolute;inset:8px 12px;border:1.5px dashed #ffffff26;border-radius:16px;pointer-events:none}
.barrel{width:114px;height:114px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#232321 0 3deg,#74746f 3deg 6deg);box-shadow:0 8px 16px #000c,0 0 0 3px #0009}
.zoom{position:absolute;left:46px;right:46px;bottom:38px;display:flex;align-items:center;gap:10px;color:var(--lcd);font:700 12px ui-monospace,Menlo,Consolas,monospace;text-shadow:0 0 5px #2fb36b99}
.zoom input{flex:1;min-width:0;height:28px;accent-color:var(--fuji);background:transparent}
.zoom span{min-width:36px;text-align:right}
.vf{touch-action:none}
.thumb{position:relative}
.thumb b{position:absolute;right:-7px;top:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--fuji);color:#06130b;font:700 12px/21px inherit;font-family:inherit;text-align:center}
.thumb b:empty{display:none}
.thumb.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.gtop{width:100%;display:flex;justify-content:space-between;align-items:center;font:700 16px inherit;font-family:inherit;color:var(--ink)}
.sm{padding:8px 14px;font-size:15px}
.strip{display:flex;width:100%;flex:1;min-height:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:6px 4px}
.slide .pola{transform:none}
</style>
</head>
<body>
<div id="app">
  <div class="plate">
    <div class="dial"><i class="ring" id="ring1"></i><div class="face"><span class="cap">FILM</span><span class="val" id="simName"></span></div><select id="simSel" aria-label="Filter film"></select></div>
    <div class="badge">FILM CAM<small>FILM SIMULATION</small></div>
    <div class="lcd"><span>EXP</span><b id="cnt">00</b><span>/36</span></div>
    <div class="dial"><i class="ring" id="ring2"></i><div class="face"><span class="cap">UKURAN</span><span class="val" id="ratName" style="font-size:17px"></span></div><select id="ratSel" aria-label="Ukuran foto"></select></div>
  </div>
  <div class="bezel"><div class="vf">
    <canvas id="cv"></canvas><i class="glass"></i>
    <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
    <div class="zoom"><input type="range" id="zoom" min="1" max="5" step="0.05" value="1" aria-label="Zoom"><span id="zval">1.0x</span></div>
    <div class="info"><span id="info"></span><span id="simLabel"></span></div>
    <div class="flash" id="flash"></div>
    <div class="msg" id="msg"><p id="msgText"></p><button class="btn" id="pick">Pilih foto dari galeri</button></div>
  </div></div>
  <div class="grip">
    <button class="knob l" id="flip" aria-label="Balik kamera"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-1.5-2h-7L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3.2 3.2 0 0 1 5.6-2M15 13a3.2 3.2 0 0 1-5.6 2"/><path d="M14.6 9v2h-2M9.4 17v-2h2"/></svg></button>
    <div class="barrel"><button class="shutter" id="snap" aria-label="Ambil foto"></button></div>
    <button class="thumb r" id="thumb" aria-label="Galeri foto"><b id="tcnt"></b></button>
  </div>
</div>
<div class="ov" id="ov">
  <div class="gtop"><span id="gcount"></span><button class="btn ghost sm" id="close">Tutup</button></div>
  <div class="strip" id="strip"></div>
  <p>Geser kiri/kanan untuk melihat foto lain. Foto tidak dikirim ke mana pun.</p>
  <div class="row"><button class="btn" id="share">Bagikan</button><button class="btn ghost" id="save">Simpan</button><button class="btn ghost" id="del">Hapus</button></div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const mk=(n,d,o)=>({n,d,sat:1,con:1,bri:0,fade:0,sh:[0,0,0],hi:[0,0,0],gr:.03,vig:.15,mono:0,cv:.3,hs:[1,1,1],cc:.06,hal:.1,...o});
const SIMS=[
 mk("Provia","Standar, natural",{sat:1.05,con:1.05,cv:.3}),
 mk("Velvia","Warna pekat, tajam",{sat:1.3,con:1.12,cv:.5,hs:[1.1,1.25,1.2],cc:.16,sh:[-.01,0,.05],hi:[.01,.005,-.02],vig:.18}),
 mk("Astia","Lembut, kulit halus",{con:.95,bri:.03,fade:.02,cv:.2,hs:[.92,1.05,1.1],cc:.03,sh:[0,.01,.015],hi:[.03,.01,0],hal:.12}),
 mk("Classic Chrome","Kalem, dokumenter",{sat:.9,con:1.08,bri:-.02,fade:.04,cv:.5,hs:[.9,.62,.72],cc:.1,sh:[-.02,.005,.05],hi:[.03,.02,-.015],gr:.05,vig:.25}),
 mk("Classic Neg.","Film negatif jadul",{con:1.1,bri:-.02,fade:.05,cv:.6,hs:[1.08,.8,.88],cc:.1,sh:[-.03,.05,.05],hi:[.07,.01,-.01],gr:.07,vig:.3,hal:.25}),
 mk("Eterna","Sinematik",{sat:.8,con:.95,fade:.06,cv:.25,hs:[.9,.85,.9],cc:.04,sh:[0,.025,.045],hi:[.025,.012,0],gr:.04,vig:.2}),
 mk("Acros","Hitam putih",{mono:1,con:1.15,cv:.55,fade:.02,gr:.1,vig:.25,hal:.08}),
 mk("Pro Neg. Hi","Kontras potret studio",{sat:.95,con:1.08,cv:.4,hs:[.98,.9,.95],fade:.02,hi:[.012,.01,0],vig:.12}),
 mk("Pro Neg. Std","Lembut, natural",{sat:.85,con:.93,bri:.02,fade:.03,cv:.2,hs:[.95,.9,.95],cc:.03,sh:[0,.01,.01],hi:[.02,.01,0],vig:.1}),
 mk("Nostalgic Neg.","Hangat, ambar",{sat:1.05,con:1.08,bri:-.01,fade:.06,cv:.5,hs:[1.12,.85,.85],cc:.1,sh:[.05,.02,0],hi:[.07,.035,-.03],gr:.06,vig:.3,hal:.3}),
 mk("Reala Ace","Akurat, jernih",{sat:1.05,con:1.05,bri:.01,cv:.35,hs:[1.05,1,1.05],hi:[.01,0,0],vig:.1}),
 mk("Eterna Bleach Bypass","Pudar, kontras keras",{sat:.5,con:1.2,bri:-.03,fade:.02,cv:.75,hs:[.9,.8,.85],cc:.08,sh:[0,.01,.02],gr:.07,vig:.3}),
 mk("Monochrome","Hitam putih biasa",{mono:1,con:1.05,cv:.35,fade:.02,gr:.05}),
 mk("Sepia","Cokelat jadul",{mono:1,con:1.08,cv:.4,fade:.05,gr:.06,vig:.3,tone:[1.1,.92,.7]}),
 mk("Acros + Kuning","Langit lebih gelap",{mono:1,con:1.15,cv:.55,fade:.02,gr:.1,vig:.25,hal:.08,mw:[.5,.45,.05]}),
 mk("Acros + Merah","Langit sangat gelap",{mono:1,con:1.2,cv:.55,fade:.02,gr:.1,vig:.25,hal:.08,mw:[.8,.2,0]}),
 mk("Acros + Hijau","Kulit halus, daun terang",{mono:1,con:1.1,cv:.5,fade:.02,gr:.1,vig:.25,hal:.08,mw:[.2,.7,.1]}),
 mk("Mono + Kuning","Hitam putih, langit lebih gelap",{mono:1,con:1.05,cv:.35,fade:.02,gr:.05,mw:[.5,.45,.05]}),
 mk("Mono + Merah","Hitam putih, langit sangat gelap",{mono:1,con:1.1,cv:.4,fade:.02,gr:.05,mw:[.8,.2,0]}),
 mk("Mono + Hijau","Hitam putih, daun lebih terang",{mono:1,con:1.05,cv:.35,fade:.02,gr:.05,mw:[.2,.7,.1]})
];

const $=id=>document.getElementById(id);
const cv=$("cv"),gl=cv.getContext("webgl",{preserveDrawingBuffer:true});
const VS="attribute vec2 p;varying vec2 uv;uniform float m;uniform vec2 crop;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);if(m>.5)uv.x=1.-uv.x;uv=(uv-.5)*crop+.5;gl_Position=vec4(p,0.,1.);}";
const FS=`precision mediump float;varying vec2 uv;uniform sampler2D t;
uniform float sat,con,bri,fade,gr,vig,mono,time,crv,cc,hal;uniform vec3 sh,hi,mw,tone,hs;uniform vec2 res;
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){vec3 c=texture2D(t,uv).rgb;
vec2 px=6./res;vec3 b=vec3(0.);
b+=max(texture2D(t,uv+vec2(px.x,0.)).rgb-.65,0.);b+=max(texture2D(t,uv-vec2(px.x,0.)).rgb-.65,0.);
b+=max(texture2D(t,uv+vec2(0.,px.y)).rgb-.65,0.);b+=max(texture2D(t,uv-vec2(0.,px.y)).rgb-.65,0.);
b+=max(texture2D(t,uv+px).rgb-.65,0.);b+=max(texture2D(t,uv-px).rgb-.65,0.);
b+=max(texture2D(t,uv+vec2(px.x,-px.y)).rgb-.65,0.);b+=max(texture2D(t,uv+vec2(-px.x,px.y)).rgb-.65,0.);
c+=b*.125*hal*3.*vec3(1.,.5,.35);
c=clamp(c,0.,1.);
c=mix(c,c*c*(3.-2.*c),crv);
c=(c-.5)*con+.5+bri;
float l=lum(c);
float mx=max(c.r,max(c.g,c.b)),ch=mx-min(c.r,min(c.g,c.b));
vec3 w=vec3(max(c.r-max(c.g,c.b),0.),max(c.g-max(c.r,c.b),0.),max(c.b-max(c.r,c.g),0.));
w/=(w.x+w.y+w.z+1e-4);
float sm=mix(1.,dot(w,hs),smoothstep(0.,.12,ch));
c=mix(vec3(l),c,sat*sm);
c*=1.-cc*smoothstep(.12,.6,ch);
l=clamp(lum(c),0.,1.);
c+=sh*(1.-l)*(1.-l)*1.4+hi*l*l*1.4;
c=fade+c*(1.-fade);
float n=fract(sin(dot(floor(uv*vec2(1000.,1000.*res.y/res.x)),vec2(12.9898,78.233))+time)*43758.5453);
c+=(n-.5)*gr*1.6*(1.-abs(l-.5)*1.3);
if(mono>.5)c=vec3(dot(c,mw))*tone;
float d=distance(uv,vec2(.5));c*=1.-vig*smoothstep(.3,.8,d);
gl_FragColor=vec4(clamp(c,0.,1.),1.);}`;
function sh_(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
const pg=gl.createProgram();gl.attachShader(pg,sh_(gl.VERTEX_SHADER,VS));gl.attachShader(pg,sh_(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pg);gl.useProgram(pg);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pg,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
[[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(a=>gl.texParameteri(gl.TEXTURE_2D,a[0],a[1]));
const U=n=>gl.getUniformLocation(pg,n);

let cur=0,facing="environment",stream=null,src=null,still=false;
let zoom=1,zmax=5,hw=false,zMin=1,zMaxHw=1,vtrack=null;
const video=document.createElement("video");video.playsInline=true;video.muted=true;

let ratio=null,crop=[1,1],CAP=1440;
function size(w,h){
 if(ratio){const a=ratio[0]/ratio[1],sa=w/h;crop=sa>a?[a/sa,1]:[1,sa/a]}else crop=[1,1];
 const cw=w*crop[0],ch=h*crop[1],k=Math.min(1,CAP/Math.max(cw,ch));
 const W=Math.round(cw*k),H=Math.round(ch*k);
 if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;gl.viewport(0,0,W,H)}}
function frame(t){
 const s=SIMS[cur];
 if(src){
  const w=src.videoWidth||src.naturalWidth,h=src.videoHeight||src.naturalHeight;
  if(w&&(src!==video||video.readyState>=2)){
   size(w,h);gl.bindTexture(gl.TEXTURE_2D,tex);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);
   const dz=(src===video&&hw)?1:zoom;gl.uniform2fv(U("crop"),[crop[0]/dz,crop[1]/dz]);gl.uniform1f(U("m"),(src===video&&facing==="user")?1:0);
   gl.uniform1f(U("sat"),s.sat);gl.uniform1f(U("con"),s.con);gl.uniform1f(U("bri"),s.bri);
   gl.uniform1f(U("fade"),s.fade);gl.uniform1f(U("gr"),s.gr);gl.uniform1f(U("vig"),s.vig);
   gl.uniform1f(U("mono"),s.mono);gl.uniform1f(U("time"),still?1:(t%1000)/10);
   gl.uniform1f(U("crv"),s.cv);gl.uniform3fv(U("hs"),s.hs);gl.uniform1f(U("cc"),s.cc);gl.uniform1f(U("hal"),s.hal);gl.uniform3fv(U("mw"),s.mw||[.299,.587,.114]);gl.uniform3fv(U("tone"),s.tone||[1,1,1]);gl.uniform3fv(U("sh"),s.sh);gl.uniform3fv(U("hi"),s.hi);gl.uniform2f(U("res"),cv.width,cv.height);
   gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
 }
}
function draw(t){frame(t);requestAnimationFrame(draw)}
requestAnimationFrame(draw);

async function getStream(){
 const base={width:{ideal:2560},height:{ideal:1920}};
 const tries=[{facingMode:{exact:facing}},{facingMode:{ideal:facing}}];
 for(const t of tries){try{return await navigator.mediaDevices.getUserMedia({video:{...base,...t},audio:false})}catch(e){}}
 return navigator.mediaDevices.getUserMedia({video:true,audio:false});
}
async function startCam(){
 $("msg").classList.remove("show");still=false;
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;await new Promise(r=>setTimeout(r,250))}
 try{
  stream=await getStream();
  video.srcObject=stream;await video.play();src=video;
  vtrack=stream.getVideoTracks()[0];hw=false;
  try{const c=vtrack.getCapabilities&&vtrack.getCapabilities();if(c&&c.zoom&&c.zoom.max>c.zoom.min){hw=true;zMin=c.zoom.min;zMaxHw=c.zoom.max}}catch(e){}
  zmax=hw?Math.min(zMaxHw,10):5;$("zoom").max=zmax;zoom=1;setZoom(1);
  const st=vtrack.getSettings();
  if(st.facingMode)facing=st.facingMode==="user"?"user":"environment";
 }catch(e){
  $("msgText").textContent="Kamera tidak bisa dibuka. Izinkan akses kamera di browser, atau pilih foto dari galeri.";
  $("msg").classList.add("show");
 }
}

SIMS.forEach((s,i)=>{const o=document.createElement("option");o.value=i;o.textContent=s.n;$("simSel").appendChild(o)});
$("simSel").onchange=e=>pick(+e.target.value);
let ri=0;function upd(){$("simName").textContent=SIMS[cur].n;$("ratName").textContent=RATS[ri][0];$("info").textContent=SIMS[cur].n.toUpperCase()+" \u00b7 "+RATS[ri][0];$("simLabel").textContent=SIMS[cur].d;$("ring1").style.transform="rotate("+cur*24+"deg)";$("ring2").style.transform="rotate("+ri*60+"deg)"}
function pick(i){cur=i;upd()}
const RATS=[["Asli",null],["1:1",[1,1]],["4:3",[4,3]],["3:4",[3,4]],["16:9",[16,9]],["9:16",[9,16]]];
RATS.forEach((r,i)=>{const o=document.createElement("option");o.value=i;o.textContent=r[0];$("ratSel").appendChild(o)});
$("ratSel").onchange=e=>{ri=+e.target.value;ratio=RATS[ri][1];upd()};
pick(0);

const photos=[];
function setZoom(z){
 zoom=Math.max(1,Math.min(zmax,z));$("zoom").value=zoom;$("zval").textContent=zoom.toFixed(1)+"x";
 if(hw&&vtrack){vtrack.applyConstraints({advanced:[{zoom:Math.max(zMin,Math.min(zMaxHw,zoom))}]}).catch(()=>{hw=false})}
}
$("zoom").oninput=e=>setZoom(+e.target.value);
const vf=document.querySelector(".vf");
vf.addEventListener("wheel",e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:.9))},{passive:false});
let pd=0,pz=1;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
vf.addEventListener("touchstart",e=>{if(e.touches.length===2){pd=dist(e.touches);pz=zoom}},{passive:true});
vf.addEventListener("touchmove",e=>{if(e.touches.length===2&&pd){e.preventDefault();setZoom(pz*dist(e.touches)/pd)}},{passive:false});
vf.addEventListener("touchend",e=>{if(e.touches.length<2)pd=0});

let n=0;
function click(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
 o.type="square";o.frequency.setValueAtTime(1800,t);o.frequency.exponentialRampToValueAtTime(300,t+.05);
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g);g.connect(a.destination);o.start();o.stop(t+.1);setTimeout(()=>a.close(),300)}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}}
function thumbUpd(){const t=$("thumb"),l=photos[photos.length-1];
 t.style.backgroundImage=l?"url("+l.url+")":"";$("tcnt").textContent=photos.length||""}
$("snap").onclick=()=>{
 if(!src)return;
 const f=$("flash");f.classList.add("on");setTimeout(()=>f.classList.remove("on"),60);
 const cap=SIMS[cur].n+" \u00b7 "+new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
 CAP=4096;frame(performance.now());const url=cv.toDataURL("image/jpeg",.95);CAP=1440;
 photos.push({url,cap,name:"film-"+SIMS[cur].n.replace(/\W+/g,"")+"-"+Date.now()+".jpg"});
 if(photos.length>40)photos.shift();
 n=n%36+1;$("cnt").textContent=String(n).padStart(2,"0");click();
 thumbUpd();const t=$("thumb");t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");
};
const strip=$("strip");
const cur_=()=>Math.max(0,Math.min(photos.length-1,Math.round(strip.scrollLeft/(strip.clientWidth||1))));
function gcount(){$("gcount").textContent=photos.length?(cur_()+1)+" / "+photos.length:""}
function build(){strip.innerHTML="";photos.forEach(p=>{
 const d=document.createElement("div");d.className="slide";
 const w=document.createElement("div");w.className="pola";
 const im=document.createElement("img");im.src=p.url;im.alt="Foto";
 const c=document.createElement("div");c.id="";c.style.cssText="padding:10px 4px 13px;color:#3a3a36;font:italic 18px 'Bradley Hand','Segoe Script','Comic Sans MS',cursive;text-align:center";c.textContent=p.cap;
 w.append(im,c);d.appendChild(w);strip.appendChild(d)})}
function openG(i){if(!photos.length)return;build();$("ov").classList.add("show");strip.scrollLeft=i*strip.clientWidth;gcount()}
strip.addEventListener("scroll",()=>requestAnimationFrame(gcount));
$("thumb").onclick=()=>openG(photos.length-1);
$("close").onclick=()=>$("ov").classList.remove("show");
$("del").onclick=()=>{if(!photos.length)return;const i=cur_();photos.splice(i,1);thumbUpd();
 if(!photos.length){$("ov").classList.remove("show");return}
 build();strip.scrollLeft=Math.min(i,photos.length-1)*strip.clientWidth;gcount()};
$("save").onclick=()=>{const p=photos[cur_()];if(!p)return;const a=document.createElement("a");a.href=p.url;a.download=p.name;document.body.appendChild(a);a.click();a.remove()};
$("share").onclick=async()=>{
 const p=photos[cur_()];if(!p)return;
 try{const b=await (await fetch(p.url)).blob();
  const f=new File([b],p.name,{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
  else alert("Tekan lama foto lalu pilih Simpan.");
 }catch(e){}
};
$("flip").onclick=async()=>{facing=facing==="user"?"environment":"user";await startCam()};
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;
 const im=new Image();im.onload=()=>{src=im;still=true;hw=false;zmax=5;$("zoom").max=5;setZoom(1);$("msg").classList.remove("show")};im.src=URL.createObjectURL(f)};
startCam();
</script>
</body>
</html>
